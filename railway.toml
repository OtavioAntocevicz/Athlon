[build]
builder = "NIXPACKS"
buildCommand = "pnpm install && pnpm --filter @athlon/backend build"

[deploy]
# Migra o banco na subida (rede interna do Railway) e sobe a API.
# seed:admin é idempotente: só cria o ADM se ainda não existir.
startCommand = "pnpm --filter @athlon/backend db:migrate && pnpm --filter @athlon/backend seed:admin && pnpm --filter @athlon/backend start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
